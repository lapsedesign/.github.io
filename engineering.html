<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2C2C2A">
<link rel="manifest" href="manifest.json">
<title>工程管理 — Lapse Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Roboto+Mono:wght@400;500&family=EB+Garamond:ital,wght@0,300;0,400;0,500;0,600&display=swap" rel="stylesheet">
<style>
  /* ═══════════════════════════════════════════════════════════════
     Lapse 暖灰调色板 — 与 lapse-quotation tailwind.config.ts 完全一致
     ═══════════════════════════════════════════════════════════════ */
  :root{
    --paper:#FAFAF7; --linen:#F1EFE8; --stone:#E5E3DA; --ash:#B4B2A9;
    --shadow:#888780; --ink:#2C2C2A; --brass:#B8A179; --moss:#5F6B5F;
    --patina:#8B5A3C; --rust:#A33D2D;
    --sans:'Inter',system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
    --mono:'Roboto Mono',ui-monospace,monospace;
    --serif:'EB Garamond',Georgia,serif;
  }

  *{box-sizing:border-box}
  html{background:var(--paper); color:var(--ink); -webkit-font-smoothing:antialiased}
  body{margin:0; font-family:var(--sans); font-size:14px; line-height:1.6; font-weight:400}
  .wrap{max-width:1200px; margin:0 auto; padding:34px 24px 90px}

  /* ── 排版原语（对应 globals.css 的 @layer components） ────────── */
  .section-label{font-size:10px; text-transform:uppercase; letter-spacing:.22em; color:var(--shadow); font-weight:500}
  .editorial-title{font-family:var(--serif); font-weight:300; letter-spacing:.12em}
  .mono{font-family:var(--mono); font-variant-numeric:tabular-nums}
  .hairline{border-bottom:1px solid var(--stone)}

  /* ── 页首 ──────────────────────────────────────────────────── */
  header{display:flex; justify-content:space-between; align-items:flex-end; gap:20px;
         padding-bottom:22px; border-bottom:1px solid var(--stone); margin-bottom:0; flex-wrap:wrap}
  header .lede{font-size:11px; letter-spacing:.34em; text-transform:uppercase; color:var(--brass); font-weight:500}
  header h1{font-family:var(--serif); font-weight:300; letter-spacing:.12em; font-size:34px; margin:8px 0 4px}
  header .sub{font-size:12.5px; color:var(--shadow)}
  .stamp{text-align:right; font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--ash)}
  .stamp b{display:block; font-family:var(--mono); font-size:13px; letter-spacing:.04em; color:var(--shadow); margin-top:3px; text-transform:none}

  /* ── 统计条 ────────────────────────────────────────────────── */
  .stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
         border-bottom:1px solid var(--stone); margin-bottom:30px}
  .stat{padding:20px 22px 20px 0; border-right:1px solid var(--stone)}
  .stat:last-child{border-right:0}
  .stat .v{font-family:var(--mono); font-size:26px; font-weight:500; letter-spacing:-.01em; margin-top:7px; line-height:1.1}
  .stat .v.sm{font-size:18px}
  .stat .v.alert{color:var(--rust)}

  /* ── 工具列 ────────────────────────────────────────────────── */
  .toolbar{display:flex; gap:24px; align-items:center; flex-wrap:wrap; margin-bottom:22px}
  .tabs{display:flex; gap:22px; flex-wrap:wrap}
  .tab{border:0; background:none; padding:0 0 5px; cursor:pointer; font-family:var(--sans);
       font-size:10.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--ash);
       border-bottom:1px solid transparent; transition:.18s}
  .tab:hover{color:var(--shadow)}
  .tab[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--ink)}
  .tab em{font-style:normal; font-family:var(--mono); font-size:10px; color:var(--ash); margin-left:5px}
  .search{flex:1; min-width:200px; border:0; border-bottom:1px solid var(--stone); background:none;
          padding:7px 2px; font-family:var(--sans); font-size:13px; color:var(--ink); outline:none; transition:border-color .18s}
  .search:focus{border-bottom-color:var(--ink)}
  .search::placeholder{color:var(--ash)}

  /* ── 案场卡 ────────────────────────────────────────────────── */
  /* gap:1px + 每张卡一圈 1px 投影 = 卡与卡之间只有一条细线，
     且行末没排满时不会露出底色空格 */
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(360px,1fr)); gap:1px; background:#fff}
  .card{background:#fff; border:0; box-shadow:0 0 0 1px var(--stone); padding:22px 22px 20px; cursor:pointer; text-align:left;
        font-family:inherit; color:inherit; width:100%; display:block; transition:background .18s}
  .card:hover{background:var(--paper)}
  .card:focus-visible{outline:1px solid var(--ink); outline-offset:-3px}

  .c-head{display:flex; justify-content:space-between; align-items:flex-start; gap:12px}
  .c-head .qid{font-family:var(--mono); font-size:10.5px; color:var(--ash); letter-spacing:.06em}
  .c-head h3{font-family:var(--serif); font-size:20px; font-weight:400; letter-spacing:.03em; margin:4px 0 3px}
  .c-head .addr{font-size:11.5px; color:var(--shadow)}
  .chip{font-size:9.5px; letter-spacing:.16em; text-transform:uppercase; padding:4px 9px;
        color:#fff; white-space:nowrap; flex:none; font-weight:500}

  .prog{display:flex; justify-content:space-between; align-items:baseline; margin-top:20px}
  .prog .v{font-family:var(--mono); font-size:22px; font-weight:500}
  .track{height:2px; background:var(--stone); margin-top:8px; position:relative}
  .track > i{display:block; height:100%; background:var(--ink); transition:width .6s cubic-bezier(.4,0,.2,1)}
  .track.fin > i{background:var(--moss)}

  /* 施工阶段轴 */
  .axis{display:flex; margin-top:20px}
  .node{flex:1; display:flex; flex-direction:column; align-items:center; gap:8px; position:relative}
  .node::before{content:""; position:absolute; top:4px; left:-50%; width:100%; height:1px; background:var(--stone)}
  .node:first-child::before{display:none}
  .node.done::before,.node.now::before{background:var(--brass)}
  .node i{width:9px; height:9px; background:var(--stone); position:relative; z-index:1; transform:rotate(45deg)}
  .node.done i{background:var(--brass)}
  .node.now i{background:var(--ink); box-shadow:0 0 0 3px var(--linen)}
  .node span{font-size:10px; color:var(--ash); letter-spacing:.04em; white-space:nowrap}
  .node.done span{color:var(--shadow)}
  .node.now span{color:var(--ink); font-weight:500}

  .c-foot{display:flex; justify-content:space-between; gap:12px; margin-top:20px; padding-top:14px;
          border-top:1px solid var(--stone); font-size:10px; letter-spacing:.14em;
          text-transform:uppercase; color:var(--ash); flex-wrap:wrap}
  .c-foot b{display:block; font-family:var(--mono); font-size:12px; letter-spacing:.02em;
            text-transform:none; color:var(--ink); font-weight:500; margin-top:3px}

  .empty{padding:70px 20px; text-align:center; color:var(--ash); font-size:13px; letter-spacing:.1em}

  /* ── 详情抽屉 ──────────────────────────────────────────────── */
  .veil{position:fixed; inset:0; background:rgba(44,44,42,.42); display:none; z-index:60;
        justify-content:flex-end}
  .veil.open{display:flex}
  .sheet{background:var(--paper); width:min(640px,100%); height:100%; overflow-y:auto;
         padding:34px 34px 60px; border-left:1px solid var(--stone); animation:slide .28s cubic-bezier(.32,.72,0,1)}
  @keyframes slide{from{transform:translateX(28px); opacity:.4} to{transform:none; opacity:1}}
  .s-head{display:flex; justify-content:space-between; align-items:flex-start; gap:16px;
          padding-bottom:20px; border-bottom:1px solid var(--stone)}
  .s-head h2{font-family:var(--serif); font-weight:300; letter-spacing:.08em; font-size:27px; margin:7px 0 5px}
  .x{border:1px solid var(--stone); background:none; width:32px; height:32px; cursor:pointer;
     font-size:15px; color:var(--shadow); flex:none; font-family:var(--sans); transition:.18s}
  .x:hover{border-color:var(--ink); color:var(--ink)}

  .block{margin-top:30px}
  .block > .section-label{display:block; padding-bottom:10px; border-bottom:1px solid var(--stone); margin-bottom:14px}

  .facts{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:20px}
  .facts .k{font-size:9.5px; letter-spacing:.18em; text-transform:uppercase; color:var(--ash)}
  .facts .v{font-family:var(--mono); font-size:13.5px; margin-top:4px}

  .rows{display:flex; flex-direction:column}
  .row{display:flex; align-items:center; gap:14px; padding:11px 0; border-bottom:1px solid var(--stone); font-size:13.5px}
  .row:last-child{border-bottom:0}
  .row .nm{flex:1}
  .row .dt{font-family:var(--mono); font-size:11.5px; color:var(--shadow)}
  .mk{width:16px; height:16px; display:grid; place-items:center; font-size:9px; flex:none;
      font-family:var(--mono); font-weight:500}
  .mk.done{background:var(--moss); color:#fff}
  .mk.now{background:var(--ink); color:#fff}
  .mk.wait{background:var(--linen); color:var(--ash)}

  table{width:100%; border-collapse:collapse; font-size:13.5px}
  th{font-size:9.5px; letter-spacing:.18em; text-transform:uppercase; color:var(--ash);
     font-weight:500; text-align:left; padding:0 0 9px; border-bottom:1px solid var(--stone)}
  td{padding:11px 0; border-bottom:1px solid var(--stone)}
  td.amt{text-align:right; font-family:var(--mono); font-weight:500}
  tr.sum td{border-bottom:0; padding-top:15px; font-weight:500}
  .tag{font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; padding:3px 8px; white-space:nowrap}
  .tag.paid{background:var(--moss); color:#fff}
  .tag.due{background:var(--rust); color:#fff}
  .tag.wait{background:var(--linen); color:var(--shadow)}

  .memo{font-size:13.5px; line-height:1.75; color:var(--ink); background:#fff;
        border:1px solid var(--stone); padding:16px 18px}
  .link{display:inline-block; margin-top:16px; font-size:10px; letter-spacing:.2em;
        text-transform:uppercase; color:var(--shadow); text-decoration:none; border-bottom:1px solid var(--stone); padding-bottom:3px}
  .link:hover{color:var(--ink); border-bottom-color:var(--ink)}

  footer{margin-top:56px; padding-top:22px; border-top:1px solid var(--stone);
         font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--ash); text-align:center}

  @media (max-width:640px){
    .wrap{padding:24px 16px 70px}
    header h1{font-size:27px}
    .stamp{display:none}
    .stat{border-right:0; border-bottom:1px solid var(--stone); padding:15px 0}
    .stats{grid-template-columns:1fr 1fr; border-bottom:0}
    .stat:nth-child(odd){padding-right:18px; border-right:1px solid var(--stone)}
    .grid{grid-template-columns:1fr}
    .node span{font-size:9px}
    .sheet{padding:24px 18px 50px}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <div class="lede">Lapse Design</div>
      <h1>工程管理</h1>
      <div class="sub">在建案场 · 施工阶段 · 收款节点</div>
    </div>
    <div class="stamp">数据截至<b id="asof"></b></div>
  </header>

  <section class="stats" id="stats"></section>

  <div class="toolbar">
    <div class="tabs" id="tabs" role="tablist"></div>
    <input class="search" id="search" type="search" placeholder="搜索单号 / 客户 / 地址 / 负责人">
  </div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>没有符合条件的案场</div>

  <footer>Lapse Design · Johor Bahru · MMXXVI</footer>
</div>

<div class="veil" id="veil"><div class="sheet" role="dialog" aria-modal="true" id="sheet"></div></div>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   工程管理 — 原型
   ───────────────────────────────────────────────────────────────────────
   资料分两层，对应正式版并入 lapse-quotation 后的两个 Sheet：

   ① QUOTE_DATABASE（报价系统既有，A–S 栏）
      id / client / contact / address / status / paymentMode
      合约总额 = calcGrandTotal(items) 算出来，不另存

   ② PROJECT_DATABASE（工程管理新增，以报价单号为主键）
      stage / stageDates / pic / start / due / note / paidUpTo

   收款节点「不存」——由 paymentMode + 合约总额即时算出，
   与 QuotePDF.tsx 的 terms-schedule 用同一组百分比，保证报价单与
   工程管理页面的金额永远一致。只有「第几期已收 + 收款日」需要记录。
   ═══════════════════════════════════════════════════════════════════════ */

/* 施工阶段 — 顺序即流程顺序 */
const STAGES = ['拆除', '水电', '泥作', '木作', '油漆', '收尾'];

/* 付款节点百分比 — 与 packages/pdf-template/src/QuotePDF.tsx 一致 */
const SCHEDULES = {
  standard: [
    { label: 'Booking / Design', zh: '订金 / 设计', pct: 0.10 },
    { label: 'Mobilization',     zh: '进场动工',   pct: 0.40 },
    { label: 'Progress Claim',   zh: '进度款',     pct: 0.40 },
    { label: 'Final Handover',   zh: '完工交付',   pct: 0.10 },
  ],
  simple: [
    { label: 'Deposit upon Confirmation',      zh: '确认订金',       pct: 0.50 },
    { label: 'Progressive (Work 50%)',         zh: '工程过半',       pct: 0.30 },
    { label: 'Progressive (Completing)',       zh: '完工',           pct: 0.20 },
  ],
};

/* 报价单状态色 — 与 packages/shared-types/src/index.ts 的 STATUS_COLORS 一致 */
const STATUS_COLORS = {
  Draft:      '#B4B2A9', Pending:    '#8B5A3C', Confirmed:  '#5F6B5F',
  Processing: '#B8A179', Completed:  '#888780', Cancelled:  '#A33D2D',
};

/* ── 示例资料 ───────────────────────────────────────────────────────── */
const DATA = [
  { id:'QT260112', client:'Setia Tropika 双层排屋', address:'Jalan Setia Tropika 5/2, Johor Bahru',
    contact:'012-778 4410', status:'Processing', paymentMode:'standard', contract:186000,
    area:'22 × 75 ft', pic:'Kenny', start:'2026-03-10', due:'2026-08-15',
    stage:3, stageDates:['2026-03-18','2026-04-06','2026-05-02','','',''],
    paidUpTo:2, paidDates:['2026-03-05','2026-03-20'],
    note:'木作已进场，系统柜面板等待供应商到货（预计 7/31）。主人房天花造型客户要求微调，已出修改图待确认。' },

  { id:'QT260104', client:'Austin Heights 半独立式', address:'Jalan Austin Heights 8, Johor Bahru',
    contact:'016-220 9087', status:'Processing', paymentMode:'standard', contract:312000,
    area:'40 × 80 ft', pic:'Wei Ling', start:'2026-01-20', due:'2026-07-20',
    stage:5, stageDates:['2026-01-28','2026-02-20','2026-03-25','2026-05-18','2026-06-28',''],
    paidUpTo:3, paidDates:['2026-01-15','2026-02-01','2026-04-02'],
    note:'收尾阶段：清洁 + 五金调整。已过合约完工日，Final Handover 尾款尚未收取，需尽快安排验收。' },

  { id:'QT260503', client:'Eco Botanic 公寓翻新', address:'Eco Botanic, Iskandar Puteri',
    contact:'011-3355 7788', status:'Processing', paymentMode:'simple', contract:98000,
    area:'1,150 sqft', pic:'Kenny', start:'2026-05-05', due:'2026-09-30',
    stage:1, stageDates:['2026-05-14','','','','',''],
    paidUpTo:1, paidDates:['2026-04-28'],
    note:'水电改线进行中。管理处施工时间限制：平日 9am–5pm，周末不可动工，进度需预留缓冲。' },

  { id:'QT260607', client:'Horizon Hills 独立洋房', address:'Horizon Hills, Iskandar Puteri',
    contact:'017-664 2039', status:'Confirmed', paymentMode:'standard', contract:458000,
    area:'50 × 90 ft', pic:'Wei Ling', start:'2026-06-15', due:'2027-01-30',
    stage:0, stageDates:['','','','','',''],
    paidUpTo:1, paidDates:['2026-06-08'],
    note:'拆除中。旧有石膏天花全数拆除，发现二楼浴室有渗水，已通知客户需追加防水工程报价（VO-001 草拟中）。' },

  { id:'QT251102', client:'Mount Austin 店屋办公室', address:'Jalan Mutiara Emas, Mount Austin',
    contact:'012-909 1174', status:'Completed', paymentMode:'standard', contract:164000,
    area:'1,800 sqft', pic:'Kenny', start:'2025-11-01', due:'2026-04-30',
    stage:6, stageDates:['2025-11-08','2025-11-28','2025-12-20','2026-02-10','2026-03-22','2026-04-18'],
    paidUpTo:4, paidDates:['2025-10-25','2025-11-10','2025-12-22','2026-04-20'],
    note:'已完工交付，款项全数结清。保固期至 2027-04-18。' },
];

/* ── 衍生计算 ───────────────────────────────────────────────────────── */
const TODAY = new Date('2026-07-29');
const RM = n => 'RM ' + Math.round(n).toLocaleString('en-MY');

const schedule = p => SCHEDULES[p.paymentMode] || SCHEDULES.standard;
const pctDone  = p => Math.round((p.stage / STAGES.length) * 100);
const paidSum  = p => schedule(p).slice(0, p.paidUpTo).reduce((s, x) => s + x.pct * p.contract, 0);
const dayGap   = p => Math.round((new Date(p.due) - TODAY) / 864e5);

/* 逾期应收：合约完工日已过，但仍有未收期数 */
function overdueSum(p){
  if (p.stage >= STAGES.length && p.paidUpTo >= schedule(p).length) return 0;
  return dayGap(p) < 0 ? p.contract - paidSum(p) : 0;
}

function state(p){
  if (p.status === 'Completed' && p.paidUpTo >= schedule(p).length)
    return { key:'done', label:'已完工', color:STATUS_COLORS.Completed };
  const d = dayGap(p);
  if (d < 0)   return { key:'late', label:'逾期 ' + Math.abs(d) + ' 天', color:STATUS_COLORS.Cancelled };
  if (d <= 30) return { key:'soon', label:'剩 ' + d + ' 天',            color:STATUS_COLORS.Processing };
  return { key:'run', label:'进行中', color:STATUS_COLORS.Confirmed };
}

/* ── 顶部统计 ───────────────────────────────────────────────────────── */
function paintStats(){
  const live  = DATA.filter(p => state(p).key !== 'done');
  const late  = DATA.filter(p => state(p).key === 'late');
  const owing = DATA.reduce((s, p) => s + (p.contract - paidSum(p)), 0);
  const od    = DATA.reduce((s, p) => s + overdueSum(p), 0);

  stats.innerHTML = [
    ['在建案场', live.length, ''],
    ['逾期预警', late.length, late.length ? 'alert' : ''],
    ['未收款项', RM(owing), 'sm'],
    ['已逾期应收', RM(od), 'sm' + (od ? ' alert' : '')],
  ].map(([k, v, cls]) =>
    `<div class="stat"><div class="section-label">${k}</div><div class="v ${cls}">${v}</div></div>`
  ).join('');
}

/* ── 筛选列 ─────────────────────────────────────────────────────────── */
const FILTERS = [
  ['all','全部'], ['run','进行中'], ['soon','即将完工'], ['late','逾期预警'], ['done','已完工'],
];
let filter = 'all', kw = '';

function paintTabs(){
  tabs.innerHTML = FILTERS.map(([k, label]) => {
    const n = k === 'all' ? DATA.length : DATA.filter(p => state(p).key === k).length;
    return `<button class="tab" role="tab" data-f="${k}" aria-selected="${k === filter}">${label}<em>${n}</em></button>`;
  }).join('');
}

/* ── 案场卡 ─────────────────────────────────────────────────────────── */
function paintGrid(){
  const q = kw.trim().toLowerCase();
  const list = DATA.filter(p =>
    (filter === 'all' || state(p).key === filter) &&
    (!q || (p.id + p.client + p.address + p.pic).toLowerCase().includes(q))
  );
  empty.hidden = list.length > 0;
  grid.style.display = list.length ? '' : 'none';

  grid.innerHTML = list.map(p => {
    const st = state(p), pct = pctDone(p);
    return `<button class="card" data-id="${p.id}" type="button">
      <div class="c-head">
        <div>
          <div class="qid">${p.id}</div>
          <h3>${p.client}</h3>
          <div class="addr">${p.address}</div>
        </div>
        <span class="chip" style="background:${st.color}">${st.label}</span>
      </div>

      <div class="prog"><span class="section-label">整体进度</span><span class="v">${pct}<small style="font-size:13px">%</small></span></div>
      <div class="track ${pct === 100 ? 'fin' : ''}"><i style="width:${pct}%"></i></div>

      <div class="axis">${STAGES.map((s, i) =>
        `<div class="node ${i < p.stage ? 'done' : i === p.stage ? 'now' : ''}"><i></i><span>${s}</span></div>`
      ).join('')}</div>

      <div class="c-foot">
        <span>负责人<b>${p.pic}</b></span>
        <span>合约完工<b>${p.due}</b></span>
        <span>已收<b>${Math.round(paidSum(p) / p.contract * 100)}%</b></span>
      </div>
    </button>`;
  }).join('');
}

/* ── 详情抽屉 ───────────────────────────────────────────────────────── */
function openSheet(id){
  const p = DATA.find(x => x.id === id);
  if (!p) return;
  const st = state(p), sch = schedule(p), paid = paidSum(p);

  sheet.innerHTML = `
    <div class="s-head">
      <div>
        <div class="qid mono" style="font-size:10.5px;color:var(--ash);letter-spacing:.06em">${p.id}</div>
        <h2>${p.client}</h2>
        <div style="font-size:12px;color:var(--shadow)">${p.address}</div>
      </div>
      <button class="x" id="closeX" type="button" aria-label="关闭">✕</button>
    </div>

    <div style="margin-top:16px">
      <span class="chip" style="background:${st.color}">${st.label}</span>
      <span class="chip" style="background:${STATUS_COLORS[p.status]};margin-left:6px">${p.status}</span>
    </div>

    <div class="block">
      <div class="facts">
        <div><div class="k">面积</div><div class="v">${p.area}</div></div>
        <div><div class="k">负责人</div><div class="v">${p.pic}</div></div>
        <div><div class="k">联络</div><div class="v">${p.contact}</div></div>
        <div><div class="k">开工</div><div class="v">${p.start}</div></div>
        <div><div class="k">合约完工</div><div class="v">${p.due}</div></div>
      </div>
    </div>

    <div class="block">
      <div class="section-label">施工阶段</div>
      <div class="rows">${STAGES.map((s, i) => {
        const done = i < p.stage, now = i === p.stage && p.stage < STAGES.length;
        return `<div class="row">
          <span class="mk ${done ? 'done' : now ? 'now' : 'wait'}">${done ? '✓' : i + 1}</span>
          <span class="nm">${s}</span>
          <span class="dt">${done ? (p.stageDates[i] || '已完成') : now ? '进行中' : '未开始'}</span>
        </div>`;
      }).join('')}</div>
    </div>

    <div class="block">
      <div class="section-label">收款节点 · ${p.paymentMode === 'simple' ? '50 / 30 / 20' : '10 / 40 / 40 / 10'}</div>
      <table>
        <thead><tr><th>期数</th><th>状态</th><th style="text-align:right">金额</th></tr></thead>
        <tbody>
          ${sch.map((x, i) => {
            const isPaid = i < p.paidUpTo;
            const late = !isPaid && dayGap(p) < 0;
            const cls = isPaid ? 'paid' : late ? 'due' : 'wait';
            const txt = isPaid ? '已收 ' + (p.paidDates[i] || '') : late ? '逾期未收' : '未到期';
            return `<tr>
              <td>${x.zh} <span style="color:var(--ash);font-size:11px">${(x.pct * 100).toFixed(0)}%</span>
                  <div style="font-size:10.5px;color:var(--ash);letter-spacing:.06em">${x.label}</div></td>
              <td><span class="tag ${cls}">${txt}</span></td>
              <td class="amt">${RM(x.pct * p.contract)}</td>
            </tr>`;
          }).join('')}
          <tr class="sum">
            <td colspan="2">合约总额 / 已收</td>
            <td class="amt">${RM(p.contract)}<div style="color:var(--moss);font-weight:400">${RM(paid)}</div></td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="block">
      <div class="section-label">现场备注</div>
      <div class="memo">${p.note}</div>
      <a class="link" href="#" onclick="return false">查看报价单 ${p.id} →</a>
    </div>`;

  veil.classList.add('open');
  document.body.style.overflow = 'hidden';
  document.getElementById('closeX').focus();
}

function closeSheet(){
  veil.classList.remove('open');
  document.body.style.overflow = '';
}

/* ── 事件 ───────────────────────────────────────────────────────────── */
grid.addEventListener('click', e => {
  const c = e.target.closest('.card');
  if (c) openSheet(c.dataset.id);
});
veil.addEventListener('click', e => {
  if (e.target === veil || e.target.id === 'closeX') closeSheet();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

tabs.addEventListener('click', e => {
  const t = e.target.closest('.tab');
  if (!t) return;
  filter = t.dataset.f;
  paintTabs();
  paintGrid();
});

search.addEventListener('input', e => { kw = e.target.value; paintGrid(); });

/* ── 启动 ───────────────────────────────────────────────────────────── */
asof.textContent = TODAY.toISOString().slice(0, 10);
paintStats();
paintTabs();
paintGrid();
</script>
</body>
</html>
